[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vandad-agent"
version = "0.1.0"
description = "Autonomous Company Operations & Marketing Agent platform - backend foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "httpx>=0.28",
    "cryptography>=44",
    "croniter>=6.0",
    "python-multipart>=0.0.20",
    "edge-tts>=6.1",
    "pillow>=11.0",
    "playwright>=1.49",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.49",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:alembic.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends(...) in argument defaults is the framework's documented pattern.
"app/api/**" = ["B008"]
# Alembic autogenerated migrations are not hand-maintained.
"alembic/versions/**" = ["E501", "I001", "W291"]
"app/integrations/platform_discovery/*.py" = ["E501", "I001"]
"app/services/platform_discovery_service.py" = ["E501", "I001"]
"app/api/v1/platform_discovery.py" = ["E501", "I001"]
"app/api/v1/__init__.py" = ["I001"]
"app/schemas/platform_discovery.py" = ["E501", "I001"]
"tests/test_platform_discovery_parsing.py" = ["E501", "I001"]
"tests/test_browser_playwright_provider.py" = ["I001"]
"app/models/platform_source_document.py" = ["E501", "I001"]
"app/integrations/providers/browser_playwright.py" = ["E501", "I001"]
"app/integrations/providers/__init__.py" = ["I001"]
"app/integrations/platform_discovery/public_sources.py" = ["E501", "I001", "E701"]
